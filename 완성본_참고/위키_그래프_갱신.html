:root{--navy:#0A2540;--blue:#1F6FE0;--blue-deep:#1553B6;--blue-tint:#E8F0FD;--coral:#D2553F;--coral-tint:#FBECE8;
--bg:#F5F8FC;--line:#D8E1EC;--body:#26405E;--muted:#69788F;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:#ffffff;color:var(--body);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
main{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
h1{margin:0 0 4px;font-size:28px;color:var(--navy)}
.how{margin:0 0 14px;font-size:17px;color:var(--muted)}
.how b{color:var(--blue-deep)}
.gr-svg{display:block;width:100%;height:auto;background:#fff;border:1.5px solid var(--line);border-radius:14px}
.gr-edge{stroke-dasharray:1;stroke-dashoffset:0;stroke-linecap:round;transition:opacity .2s}
.gr-svg.run .gr-edge{animation:grDraw .55s ease-out both}
.gr-svg.run .gr-node{animation:grPop .35s ease-out both}
@keyframes grDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grPop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.gr-edge,.gr-node{animation:none!important}}
.gr-node{cursor:pointer}
.gr-node.sel rect{stroke:var(--coral)!important;stroke-width:4!important}
.gr-svg.has-sel .gr-edge{opacity:.12!important}
.gr-svg.has-sel .gr-edge.on{opacity:.95!important}
.legend{margin:8px 2px 12px;font-size:15px;color:var(--muted)}
.gr-panel{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.gp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;font-size:21px;color:var(--navy)}
.gp-k{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.gp-t{font-weight:800}
.gp-f{font-family:var(--mono);font-size:14px;color:var(--muted)}
.gp-l{font-size:18px;line-height:1.55}
.gp-l b{color:var(--blue-deep)}
.gp-l.bf{color:var(--muted)}
.gp-l.af{color:var(--navy);font-weight:700}
.gp-m{font-size:17px;color:var(--navy);line-height:1.5}
.gp-m span{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:700;margin-right:6px}
.note{margin-top:12px;font-size:14px;color:var(--muted)}
</style></head>
